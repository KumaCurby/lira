name: lecture_rapide
description: "Véloce — entraînement à la lecture rapide (RSVP, guidage, écrémage, balayage, Schulte). Flutter + TDD."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1          # drapeaux SVG du sélecteur de langue
  shared_preferences: ^2.3.2     # persistance cross-platform (Phase 1)
  flutter_riverpod: ^2.5.1       # état & injection (Phase 2)
  fl_chart: ^0.69.0              # graphiques de progression (Phase 3)
  file_picker: ^11.0.2
  archive: ^4.0.9
  xml: ^6.6.1
  syncfusion_flutter_pdf: ^33.2.13
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/corpus/          # corpus FR intégré (Phase 1)

# Icônes de lancement (générées avec : dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/branding/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#6C4DF6"
  adaptive_icon_foreground: "assets/branding/foreground.png"
  web:
    generate: true
    background_color: "#6C4DF6"
    theme_color: "#6C4DF6"
  macos:
    generate: true
  windows:
    generate: true

# Écran de démarrage (généré avec : dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#6C4DF6"
  image: "assets/branding/foreground.png"
  android_12:
    color: "#6C4DF6"
    image: "assets/branding/foreground.png"
